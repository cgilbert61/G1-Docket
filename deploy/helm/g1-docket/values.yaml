# Default values for g1-docket.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  environment: "production"
  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""

# Common labels applied to all resources
commonLabels:
  app.kubernetes.io/part-of: g1-docket
  security.g1.io/tier: institutional

# Zero-Trust Network Policy Enforcement
networkPolicy:
  enabled: true

# Prevalidator Admission Gateway
prevalidator:
  replicaCount: 3
  image:
    repository: ghcr.io/cgilbert61/g1-docket-prevalidator
    pullPolicy: Always
    tag: "1.0.2"
  service:
    type: ClusterIP
    port: 18082
    targetPort: 8082
  mode: "enforce" # "enforce" (active blocking) | "observe" (audit-only)
  strictInlineHash: true
  enablePresidioFallback: true
  policies:
    enableDataResidency: false
    enableDepartmentalIsolation: false
  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  nodeSelector: {}
  tolerations: []
  affinity: {}

# HITL Governance Console & WORM Audit SIEM
governance:
  replicaCount: 1
  image:
    repository: ghcr.io/cgilbert61/g1-docket-governance
    pullPolicy: Always
    tag: "1.0.2"
  service:
    type: ClusterIP
    port: 18084
    targetPort: 8084
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 256Mi
  persistence:
    enabled: true
    storageClass: ""
    size: 20Gi
    accessModes:
      - ReadWriteOnce

# Authoritative Cryptographic Snapshot Publisher
snapshotPublisher:
  replicaCount: 1
  image:
    repository: ghcr.io/cgilbert61/g1-docket-publisher
    pullPolicy: Always
    tag: "1.0.2"
  service:
    type: ClusterIP
    port: 18081
    targetPort: 8081

# Attestation & DLP Classification Engine
engine:
  replicaCount: 2
  image:
    repository: ghcr.io/cgilbert61/g1-docket-engine
    pullPolicy: Always
    tag: "1.0.2"
  service:
    type: ClusterIP
    port: 18083
    targetPort: 8083

# Secrets & Tokens (can be replaced with external secrets operator or Vault)
secrets:
  adminApiKey: "change-me-in-production-admin-key"
  controlPlaneToken: "change-me-in-production-token"
  jwtSecret: "change-me-in-production-jwt-secret-at-least-32-chars"

# Enterprise Governance, Data Stewards & Crawl Target Configuration
enterprise:
  demoMode: false
  defaultOwner: "data-governance@yourcompany.com"
  defaultSteward: "data-stewards@yourcompany.com"
  crawlDirectory: "/var/lib/pod/state/estate"
  stewards:
    tierRestricted: "security-stewards@yourcompany.com"
    tierConfidential: "compliance-stewards@yourcompany.com"
    tierInternal: "data-stewards@yourcompany.com"
    tierPublic: "open-data@yourcompany.com"

# Upstream Multi-Model AI Gateway & Provider Routing
gateway:
  defaultUpstream: "http://litellm:4000"
  timeoutSeconds: 30
  retryCount: 2

# Hardware Security Module (HSM) & Cloud KMS Key Signers
kms:
  provider: "local" # "local" | "aws_kms" | "azure_keyvault" | "gcp_kms"
  awsKeyArn: ""
  awsRegion: "us-east-1"
  azureVaultUrl: ""
  azureKeyName: ""
  gcpKeyResourceName: ""

# Operator Authentication & RBAC Policy
auth:
  cookieSecure: true
  sessionTtlSeconds: 28800
  lockoutAttempts: 5
  lockoutDurationSeconds: 900
  oidc:
    enabled: false
    issuerUrl: ""
    clientId: ""

# Enterprise SIEM & Immutable Audit Sinks
siem:
  googleCloudLogging:
    enabled: false
    logName: "g1-docket-worm-audit"
  splunk:
    enabled: false
    hecUrl: ""

# Ingress configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
  hosts:
    - host: docket.internal.corp
      paths:
        - path: /v1
          pathType: Prefix
          service: prevalidator
        - path: /governance
          pathType: Prefix
          service: governance
  tls:
    - secretName: g1-docket-tls
      hosts:
        - docket.internal.corp

# Prometheus Operator Monitoring & Alerting
monitoring:
  serviceMonitor:
    enabled: false
    interval: "15s"
    scrapeTimeout: "10s"
    labels: {}
  prometheusRule:
    enabled: false
    labels: {}
  grafanaDashboard:
    enabled: false
    labels:
      grafana_dashboard: "1"

