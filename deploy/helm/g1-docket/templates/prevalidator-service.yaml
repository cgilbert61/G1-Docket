apiVersion: v1
kind: Service
metadata:
  name: {{ include "g1-docket.fullname" . }}-prevalidator
  labels:
    {{- include "g1-docket.labels" . | nindent 4 }}
    app.kubernetes.io/component: prevalidator
spec:
  type: {{ .Values.prevalidator.service.type }}
  ports:
    - port: {{ .Values.prevalidator.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "g1-docket.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: prevalidator
