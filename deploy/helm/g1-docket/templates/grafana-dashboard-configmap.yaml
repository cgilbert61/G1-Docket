{{- if .Values.monitoring.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "g1-docket.fullname" . }}-grafana-dashboard
  labels:
    {{- include "g1-docket.labels" . | nindent 4 }}
    {{- with .Values.monitoring.grafanaDashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  g1-docket-dashboard.json: |-
{{ .Files.Get "dashboards/g1-docket-dashboard.json" | indent 4 }}
{{- end }}
