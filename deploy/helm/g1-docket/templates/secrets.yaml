apiVersion: v1
kind: Secret
metadata:
  name: {{ include "g1-docket.fullname" . }}-secrets
  labels:
    {{- include "g1-docket.labels" . | nindent 4 }}
type: Opaque
stringData:
  POD_ADMIN_API_KEY: {{ .Values.secrets.adminApiKey | quote }}
  POD_CONTROL_PLANE_TOKEN: {{ .Values.secrets.controlPlaneToken | quote }}
  POD_JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
