apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "g1-docket.fullname" . }}-publisher
  labels:
    {{- include "g1-docket.labels" . | nindent 4 }}
    app.kubernetes.io/component: publisher
spec:
  replicas: {{ .Values.snapshotPublisher.replicaCount }}
  selector:
    matchLabels:
      {{- include "g1-docket.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: publisher
  template:
    metadata:
      labels:
        {{- include "g1-docket.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: publisher
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: publisher
          image: "{{ .Values.snapshotPublisher.image.repository }}:{{ .Values.snapshotPublisher.image.tag }}"
          imagePullPolicy: {{ .Values.snapshotPublisher.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: {{ .Values.snapshotPublisher.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "g1-docket.fullname" . }}-config
            - secretRef:
                name: {{ include "g1-docket.fullname" . }}-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
