apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "g1-docket.fullname" . }}-governance
  labels:
    {{- include "g1-docket.labels" . | nindent 4 }}
    app.kubernetes.io/component: governance
spec:
  replicas: {{ .Values.governance.replicaCount }}
  selector:
    matchLabels:
      {{- include "g1-docket.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: governance
  template:
    metadata:
      labels:
        {{- include "g1-docket.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: governance
    spec:
      containers:
        - name: governance
          image: "{{ .Values.governance.image.repository }}:{{ .Values.governance.image.tag }}"
          imagePullPolicy: {{ .Values.governance.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.governance.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "g1-docket.fullname" . }}-config
            - secretRef:
                name: {{ include "g1-docket.fullname" . }}-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.governance.resources | nindent 12 }}
          volumeMounts:
            - name: worm-audit-storage
              mountPath: /var/lib/pod/state
      volumes:
        - name: worm-audit-storage
          {{- if .Values.governance.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "g1-docket.fullname" . }}-worm-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}
