# Reusable Sidecar Pattern for AI Inference Pods
# Inject this container spec into any AI Agent, vLLM, or LangChain deployment
# to enforce zero-trust data admission control directly over localhost:18082.
apiVersion: v1
kind: Pod
metadata:
  name: ai-agent-with-docket-sidecar
  namespace: g1-docket
  labels:
    app.kubernetes.io/name: agent-with-docket-sidecar
    app: secure-ai-agent
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    # 1. Main Application / AI Agent Container
    - name: ai-agent
      image: python:3.11.8-slim
      imagePullPolicy: Always
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        capabilities:
          drop:
            - ALL
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "AI Agent started. Routing LLM requests through http://127.0.0.1:18082..."
          sleep 3600
      env:
        # Route all OpenAI API calls to the local Prevalidator sidecar
        - name: OPENAI_BASE_URL
          value: "http://127.0.0.1:18082/v1"
        - name: POD_CALLER_KEY
          value: "pod-key-internal"
      resources:
        requests:
          cpu: "500m"
          memory: "512Mi"
        limits:
          cpu: "1000m"
          memory: "1Gi"
      volumeMounts:
        - name: tmp
          mountPath: /tmp

    # 2. G1 Docket Sub-Millisecond Prevalidator Sidecar
    - name: docket-prevalidator-sidecar
      image: ghcr.io/cgilbert61/g1-docket-prevalidator:1.0.2
      imagePullPolicy: Always
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        capabilities:
          drop:
            - ALL
      ports:
        - containerPort: 18082
          name: local-proxy
      env:
        - name: POD_PREVALIDATOR_MODE
          value: "enforce"
        - name: POD_UPSTREAM_GATEWAY_URL
          value: "https://api.openai.com/v1" # Or internal LiteLLM / vLLM cluster
        - name: POD_SNAPSHOT_PUBLISHER_URL
          value: "http://snapshot-publisher.g1-docket.svc.cluster.local:18081/v1/snapshot"
        - name: POD_PUBLIC_KEY_DIR
          value: "/var/lib/pod/public_keys"
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "1000m"
          memory: "512Mi"
      volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: tmp
          mountPath: /tmp
      livenessProbe:
        httpGet:
          path: /healthz
          port: 18082
        initialDelaySeconds: 2
        periodSeconds: 10
      readinessProbe:
        httpGet:
          path: /healthz
          port: 18082
        initialDelaySeconds: 2
        periodSeconds: 5

  volumes:
    - name: tmp
      emptyDir: {}
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 256Mi
