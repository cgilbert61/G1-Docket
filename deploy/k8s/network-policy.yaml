apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: g1-docket-default-deny-ingress
  namespace: g1-docket
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: g1-docket-prevalidator-ingress
  namespace: g1-docket
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prevalidator
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 18082
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: g1-docket-governance-ingress
  namespace: g1-docket
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: governance
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prevalidator
      ports:
        - protocol: TCP
          port: 18084
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: g1-docket-sidecar-ingress
  namespace: g1-docket
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent-with-docket-sidecar
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 18082
