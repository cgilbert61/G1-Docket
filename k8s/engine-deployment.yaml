apiVersion: apps/v1
kind: Deployment
metadata:
  name: g1-docket-engine
  namespace: g1-docket-system
  labels:
    app.kubernetes.io/name: g1-docket-engine
    app.kubernetes.io/part-of: g1-docket
    tier: attestation-engine
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: g1-docket-engine
  template:
    metadata:
      labels:
        app: g1-docket-engine
    spec:
      containers:
        - name: engine
          image: ghcr.io/cgilbert61/g1-docket/engine:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: g1-docket-config
          ports:
            - name: http-engine
              containerPort: 8083
              protocol: TCP
          resources:
            requests:
              cpu: "2000m"
              memory: "4Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: g1-docket-engine
  namespace: g1-docket-system
  labels:
    app.kubernetes.io/name: g1-docket-engine
spec:
  type: ClusterIP
  selector:
    app: g1-docket-engine
  ports:
    - name: http
      port: 8083
      targetPort: 8083
      protocol: TCP
