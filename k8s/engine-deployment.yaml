apiVersion: apps/v1
kind: Deployment
metadata:
  name: g1-docket-engine
  namespace: g1-docket-system
  labels:
    app.kubernetes.io/name: g1-docket-engine
    app.kubernetes.io/part-of: g1-docket
    tier: attestation-engine
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: g1-docket-engine
  template:
    metadata:
      labels:
        app: g1-docket-engine
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: engine
          image: ghcr.io/cgilbert61/g1-docket/engine:1.0.2
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: g1-docket-config
          ports:
            - name: http-engine
              containerPort: 8083
              protocol: TCP
          resources:
            requests:
              cpu: "2000m"
              memory: "4Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8083
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: g1-docket-engine
  namespace: g1-docket-system
  labels:
    app.kubernetes.io/name: g1-docket-engine
spec:
  type: ClusterIP
  selector:
    app: g1-docket-engine
  ports:
    - name: http
      port: 8083
      targetPort: 8083
      protocol: TCP
