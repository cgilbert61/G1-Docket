apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: g1-docket-default-deny-ingress
  namespace: g1-docket-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: g1-docket-prevalidator-ingress
  namespace: g1-docket-system
spec:
  podSelector:
    matchLabels:
      app: g1-docket-prevalidator
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {} # Allow agent workloads from any namespace
      ports:
        - protocol: TCP
          port: 8082
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: g1-docket-governance-ingress
  namespace: g1-docket-system
spec:
  podSelector:
    matchLabels:
      app: g1-docket-governance
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: g1-docket-prevalidator
        - podSelector:
            matchLabels:
              app: g1-docket-engine
      ports:
        - protocol: TCP
          port: 8084
