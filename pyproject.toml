[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "G1-Docket-SDK"
version = "0.1.0"
description = "G1 Docket Developer Client SDK — Zero-Trust Data Attestation & AI Gateway Integrations"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.26.0",
    "pydantic>=2.5.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
integrations = [
    "langchain-core>=0.1.0",
    "llama-index-core>=0.10.0",
]

[project.scripts]
docket = "docket.cli:main"
pod = "docket.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["docket*", "sdk*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "conformance"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
