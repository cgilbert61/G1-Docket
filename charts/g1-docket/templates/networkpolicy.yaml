apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "g1-docket.fullname" . }}-default-deny
  labels:
    {{- include "g1-docket.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "g1-docket.fullname" . }}-prevalidator
  labels:
    {{- include "g1-docket.labels" . | nindent 4 }}
    app.kubernetes.io/component: prevalidator
spec:
  podSelector:
    matchLabels:
      {{- include "g1-docket.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: prevalidator
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.prevalidator.service.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "g1-docket.fullname" . }}-governance
  labels:
    {{- include "g1-docket.labels" . | nindent 4 }}
    app.kubernetes.io/component: governance
spec:
  podSelector:
    matchLabels:
      {{- include "g1-docket.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: governance
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "g1-docket.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: prevalidator
      ports:
        - protocol: TCP
          port: {{ .Values.governance.service.port }}
