# SonarQube & SonarCloud Configuration for G1 Docket
# Federal DevSecOps Static Application Security Testing (SAST)

sonar.projectKey=cgilbert61_G1-Docket
sonar.organization=g1163rt
sonar.projectName=G1 Docket
sonar.projectVersion=0.1.0

# Source & Test Code Layout
sonar.sources=docket,prevalidator,engine,registry,snapshot,governance,conformance
sonar.tests=tests
sonar.python.version=3.10,3.11,3.12,3.13
sonar.sourceEncoding=UTF-8

# Test Execution & Coverage Reports
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

# Exclusions
sonar.exclusions=**/__pycache__/**,scratch/**,venv/**,.venv/**,reports/**,docs/**,dist/**,build/**,deploy/**
sonar.coverage.exclusions=tests/**,scripts/**,benchmarks/**,examples/**,scratch/**

# Security & CWE Analysis Profiles
sonar.security.sources=docket,prevalidator,engine,registry,snapshot,governance
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S106
sonar.issue.ignore.multicriteria.e1.resourceKey=scripts/**
