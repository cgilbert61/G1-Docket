name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest pytest-asyncio httpx

    - name: Run Full Test & Conformance Suite
      run: |
        pytest -v tests/ conformance/

    - name: Run Reproducible End-to-End Demo
      run: |
        python examples/run_demo.py

  helm-lint:
    name: Helm Chart Validation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Helm
      uses: azure/setup-helm@v4
      with:
        version: v3.14.0

    - name: Lint Helm Chart
      run: |
        helm lint deploy/helm/g1-docket

    - name: Test Helm Template Generation
      run: |
        helm template g1-docket deploy/helm/g1-docket --set ingress.enabled=true
